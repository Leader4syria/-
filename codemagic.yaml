workflows:
  android-debug:
    name: Android Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      java: 17

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Check project files
        script: |
          set -e
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "Gradle folder:"
          find gradle -maxdepth 3 -type f 2>/dev/null || true

      - name: Set Android SDK location
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          cat "$CM_BUILD_DIR/local.properties"

      - name: Create Gradle 9.3.1 wrapper
        script: |
          set -e

          if [ ! -f "$CM_BUILD_DIR/gradlew" ]; then
            echo "gradlew is missing. Creating Gradle Wrapper 9.3.1..."

            rm -rf /tmp/gradle-9.3.1
            rm -f /tmp/gradle-9.3.1-bin.zip

            curl -L \
              "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" \
              -o /tmp/gradle-9.3.1-bin.zip

            unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp

            /tmp/gradle-9.3.1/bin/gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin
          fi

          chmod +x "$CM_BUILD_DIR/gradlew"

          echo "Gradle wrapper files:"
          ls -la gradlew gradlew.bat gradle/wrapper || true

          ./gradlew --version

      - name: Build Android Debug APK
        script: |
          set -e
          ./gradlew clean :app:assembleDebug \
            --stacktrace \
            --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/**
      - app/build/test-results/**
